name: Locadora Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCADORA_QA_ADMIN_PASSWORD: '1234'
      ELECTRON_ENABLE_LOGGING: '1'
      ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run qa:install
      - name: Static, domain, persistence, sync and vertical gates
        run: npm run verify
      - name: Disaster recovery scenarios
        run: npm run dr:test
      - name: Cloudflare local D1 migrations and public assets
        run: npm run cloud:migrations:local && npm run cloud:assets && npm run cloud:test
      - name: Code coverage gate
        run: npm run coverage
      - name: Electron E2E
        run: timeout --signal=TERM --kill-after=30s 12m xvfb-run -a npm run e2e
      - name: ArtiSys QA release gate
        run: timeout --signal=TERM --kill-after=30s 12m xvfb-run -a npm run qa:release
      - name: Plano 03 release structure
        run: npm run plan03:gate
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locadora-qa-${{ github.run_id }}
          path: |
            qa-artifacts/
            artifacts/
            qa/reports/
          if-no-files-found: warn
          retention-days: 14
