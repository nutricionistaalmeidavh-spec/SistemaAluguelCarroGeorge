name: Importar sistema base

on:
  push:
    paths:
      - '.github/workflows/importar-sistema-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    name: Copiar locadoracarros para George
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio do George
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout do sistema base
        uses: actions/checkout@v4
        with:
          repository: nutricionistaalmeidavh-spec/locadoracarros
          ref: 6eb32fb72dbc08e4c730fc7a567a1c1bbd7f77ec
          path: source
          persist-credentials: false

      - name: Substituir conteudo pelo snapshot do sistema base
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' source/ target/

      - name: Commitar copia independente
        working-directory: target
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para commitar.'
          else
            git commit -m 'chore: copiar sistema base para personalizacao do George'
            git push origin HEAD:main
          fi
